<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main id="todo-app">
        <!-- Header -->
        <header>
            <h1>Todo App</h1>
        </header>

        <!-- Input Form -->
        <section id="new-task-section">
            <input type="text" id="new-task-input" placeholder="What needs to be done?" />
            <button id="add-task-btn">Add</button>
        </section>

        <!-- Filter Bar -->
        <nav id="filter-bar">
            <button class="filter-btn" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </nav>

        <!-- Task List -->
        <ul id="task-list">
            <!-- Dynamic task items will be inserted here -->
        </ul>

        <!-- Clear Completed Button -->
        <section id="clear-section">
            <button id="clear-completed-btn">Clear Completed</button>
        </section>
    </main>
</body>
</html>
